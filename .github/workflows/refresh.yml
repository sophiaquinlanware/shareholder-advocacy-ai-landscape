name: Refresh and publish

# Every Monday at 13:00 UTC: check SEC EDGAR for new filings, update holdings,
# rebuild the relationship graph, save the results, and republish the site.
# Also republishes whenever new code or data is pushed, and can be run by hand
# from the Actions tab with the "Run workflow" button.
#
# Publishing stays off until the repo variable PAGES_ENABLED is set to "true"
# (done when the repo goes public and GitHub Pages is turned on).
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run: refresh (default), publish (republish only; used after a posted forecast) or fund-votes (private review, not published)"
        required: false
        default: refresh
      families:
        description: "For fund-votes: limit to these fund families, comma separated (blank = all)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || (inputs.task != 'fund-votes' && inputs.task != 'publish'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SEC EDGAR, update holdings, rebuild the graph
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/refresh.py || echo "Filing check skipped"
          python scripts/holdings.py
          pip install --quiet pypdf
          python scripts/sec_leads.py || echo "SEC leads skipped"
          python scripts/build_proposal_links.py
          python scripts/build_graph.py
          python scripts/build_value_chain.py
          python scripts/build_sim_params.py
          python scripts/build_campaigns.py
          python scripts/build_forecast.py
          python scripts/build_freshness.py
      - name: Save any changes
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly refresh: $(date -u +%Y-%m-%d)"
          # Other sessions push to main too: replay this commit on top of theirs, then push; try a few times.
          # A file both changed stops the run (rebase aborted) rather than overwrite newer work.
          pushed=no
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then git push && { pushed=yes; break; }; else git rebase --abort; exit 1; fi
            sleep 10
          done
          [ "$pushed" = yes ] || exit 1
          # Prediction board: rebuilt last, from the newest main, because posted forecasts also write it
          # (.github/workflows/forecasts.yml). On a refused push, start again from main rather than rebase.
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python scripts/build_questions.py
            git add data/forecast-questions.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Prediction board: new questions and results"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1

  # Fund votes from Form N-PX, for REVIEW before anything goes on the site.
  # Nothing is committed or published. The raw result (public SEC data, no commentary)
  # is kept as a run artifact for 2 days; on a public repo, signed-in GitHub users can download it.
  fund-votes:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'fund-votes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read fund votes from SEC Form N-PX
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/npx_votes.py --out fund_votes_review.json --families "${{ inputs.families }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fund-votes-review
          path: fund_votes_review.json
          retention-days: 2

  deploy:
    needs: refresh
    if: always() && vars.PAGES_ENABLED == 'true' && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Publish only the built site (index.html, the files it links and data/), not docs, tests or scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the public site into dist/
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

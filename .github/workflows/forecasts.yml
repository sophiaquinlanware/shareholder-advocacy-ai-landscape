name: Add a posted forecast

# When someone posts a forecast with the board's issue form (label "forecast"), check it, add it to
# data/predictions.json, rebuild data/forecast-questions.json, reply, close and lock the issue, and republish.
# The issue's text reaches the scripts only through environment variables, never through the shell.
# The reply says "Added" only if the forecast was pushed to main.
# No concurrency group: GitHub cancels queued runs in a group, which would drop forecasts. Runs instead start
# again from the newest main whenever a push is refused, so simultaneous forecasts and the weekly refresh are safe.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'forecast')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check, add and save the forecast
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            # GitHub runs this step with bash -e: capture the exit code without ending the step.
            rc=0; python scripts/ingest_forecast.py > reply.txt || rc=$?
            if [ "$rc" = "3" ]; then echo "result=rejected" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$rc" != "0" ]; then echo "result=error" >> "$GITHUB_OUTPUT"; exit 0; fi
            python scripts/build_questions.py || { echo "result=error" >> "$GITHUB_OUTPUT"; exit 0; }
            git add data/predictions.json data/forecast-questions.json
            git commit -q -m "Forecast posted: issue #${ISSUE_NUMBER}"
            if git push -q origin HEAD:main; then echo "result=saved" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i * 10))
          done
          echo "result=error" >> "$GITHUB_OUTPUT"
      - name: Reply, close and lock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RESULT: ${{ steps.add.outputs.result }}
        run: |
          case "$RESULT" in
            saved)
              gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file reply.txt
              gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed
              gh issue lock "$NUM" --repo "$GITHUB_REPOSITORY" --reason resolved || true
              gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" -f task=publish ;;
            rejected)
              { echo "This forecast was not added:"; echo; cat reply.txt; echo; echo "Fix the form fields and post again as a new issue."; } > why.txt
              gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file why.txt
              gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason "not planned"
              gh issue lock "$NUM" --repo "$GITHUB_REPOSITORY" --reason resolved || true ;;
            *)
              echo "This forecast was not added because of a server error. The issue stays open so the site's maintainer sees it; you can also post again." > why.txt
              gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file why.txt
              exit 1 ;;
          esac
